<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rae ARK — Web Novelist</title>
  <meta name="description" content="Rae ARK writes fantasy and science-fantasy stories about people rebuilding themselves — reincarnation, isekai, and the quiet work of learning how to live again.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="alternate" type="application/rss+xml" title="Rae ARK — Writing Journal" href="/feed.xml">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <!-- Share-card tags. Link-preview scrapers do not run JavaScript, so in this
       SPA they only ever see these static tags: one card for the whole site.
       Absolute URLs are required by Open Graph; update them if the site's
       address changes. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rae ARK">
  <meta property="og:title" content="Rae ARK — Web Novelist">
  <meta property="og:description" content="Fantasy and science-fantasy stories about people rebuilding themselves — reincarnation, isekai, and the quiet work of learning how to live again.">
  <meta property="og:url" content="https://rae-ark.horizonarkstudio.workers.dev/">
  <meta property="og:image" content="https://rae-ark.horizonarkstudio.workers.dev/assets/images/og-card.jpg?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Rae ARK, web novelist, beside the cover of Enigmatic Pathways Mystic Circuits">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rae ARK — Web Novelist">
  <meta name="twitter:description" content="Fantasy and science-fantasy stories about people rebuilding themselves.">
  <meta name="twitter:image" content="https://rae-ark.horizonarkstudio.workers.dev/assets/images/og-card.jpg?v=2">
  <meta name="theme-color" content="#f6f2e8">

  <script>
    // Set the theme attribute before first paint so there's no flash of the
    // wrong palette. useTheme.ts reads this same value back on mount.
    (function () {
      try {
        var stored = localStorage.getItem('ark-theme')
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
        // Browser/PWA status bar colour = --paper for the chosen theme.
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#17160f' : '#f6f2e8')
      } catch (e) {}
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="/neutralino.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
