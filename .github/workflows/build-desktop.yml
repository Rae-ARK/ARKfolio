name: Build desktop binaries (Linux, Windows, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Fetch Neutralino binaries + client library
        run: npx neu update

      - name: Build Neutralino app (embedded resources, release)
        run: npx neu build --release --embed-resources

      - name: Package .deb
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Sanity-check the package
        run: |
          dpkg-deb --info dist/deb/*.deb
          dpkg-deb --contents dist/deb/*.deb

      - name: Stage Windows + macOS binaries under friendly names
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/desktop
          cp dist/arkfolio/arkfolio-win_x64.exe        "dist/desktop/ArkFolio-${VERSION}-windows-x64.exe"
          cp dist/arkfolio/arkfolio-mac_universal       "dist/desktop/ArkFolio-${VERSION}-macos-universal"
          cp dist/arkfolio/arkfolio-mac_x64             "dist/desktop/ArkFolio-${VERSION}-macos-intel"
          cp dist/arkfolio/arkfolio-mac_arm64            "dist/desktop/ArkFolio-${VERSION}-macos-applesilicon"
          cp dist/arkfolio/arkfolio-linux_x64            "dist/desktop/ArkFolio-${VERSION}-linux-x64"
          chmod +x dist/desktop/ArkFolio-*

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkfolio-deb
          path: dist/deb/*.deb
          if-no-files-found: error

      - name: Upload Windows + macOS + Linux binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arkfolio-desktop-binaries
          path: dist/desktop/*
          if-no-files-found: error

      - name: Attach all desktop binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deb/*.deb
            dist/desktop/*
