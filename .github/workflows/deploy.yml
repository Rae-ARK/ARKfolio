name: Deploy to Cloudflare

# Manual-trigger only for now — flip this to `push: branches: [main]` once
# CLOUDFLARE_API_TOKEN is added under Settings → Secrets and variables →
# Actions in this repo. Until then this just sits here, unused, and won't
# fail your push builds.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
