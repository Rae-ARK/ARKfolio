name: Android build

# Builds a debug APK on every push to svelte5-website (and manually, on
# demand). Google's Maven repos aren't reachable from a sandboxed dev
# environment, so this is the first real end-to-end proof the Capacitor/
# Gradle setup added in Stage 7 actually produces a working APK.
#
# Also runs on v* tags, alongside build-desktop.yml: a tagged release gets
# both the debug APK and a signed release APK attached next to the
# Linux/Windows/macOS binaries, instead of only being reachable as a CI
# run artifact.
on:
  push:
    branches: [svelte5-website]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'static/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync into Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses + install required platform/build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arkfolio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The debug APK above is uploaded as a CI artifact only (for
      # verifying the build works) — it is never staged into dist/android,
      # so it can't end up attached to a GitHub Release. Only the signed
      # release APK below is published with tagged releases.

      # Signed release build only runs for tagged releases (v*), since it
      # needs the keystore secrets and there's no reason to sign every
      # ordinary push to svelte5-website. Run `scripts/generate-keystore.sh`
      # once locally and add the four ANDROID_* repo secrets it prints out
      # before this step will produce anything.
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — run scripts/generate-keystore.sh and add the repo secrets described in its output."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release-keystore.jks"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remove decoded keystore
        if: always() && startsWith(github.ref, 'refs/tags/')
        run: rm -f "${{ github.workspace }}/release-keystore.jks"

      - name: Stage signed release APK under a versioned name
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/android/ArkFolio-${VERSION}-android-release.apk"

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/android/*.apk
