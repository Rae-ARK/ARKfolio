name: Android build

# Builds a debug APK on GitHub-hosted runners on every push/PR,
# installs and launches it on a throwaway emulator on the same runner
# to confirm it doesn't crash immediately, and separately builds a
# release APK (signed if RELEASE_KEYSTORE_BASE64 and friends are
# configured as repo secrets, unsigned otherwise) -- see
# ANDROID-BACKEND-IMPLEMENTATION.md, Stages 2, 3, and 4. Requires no
# JDK, Android SDK, or emulator/device on your own machine for any of
# the three jobs; all of it lives on the runner.
#
# Lives at the repo root (.github/workflows/) rather than under
# android-project/ -- GitHub Actions only discovers workflow files at
# the top level of a repo, never in a subdirectory -- so every `run:`
# step below is pinned to android-project/ via `working-directory`,
# and every artifact/keystore path is prefixed with android-project/
# to match (those aren't affected by a step's `working-directory`;
# they're always resolved from the repo root / $GITHUB_WORKSPACE).
on:
  push:
    branches: [main, arklight]
  pull_request:
  workflow_dispatch:

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-project
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKlight-App-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  install-launch-smoke-test:
    name: Install + launch on an emulator
    needs: assemble-debug
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ARKlight-App-debug-apk
          path: apk

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            APK="$(find apk -name '*.apk' | head -n 1)"
            adb install -r "$APK"
            adb shell am start -n com.arklight.app/com.arklight.app.MainActivity
            sleep 5
            if ! adb shell pidof com.arklight.app; then
              echo "::error::App process not found a few seconds after launch -- it likely crashed on startup. See logcat below."
              adb logcat -d "*:E"
              exit 1
            fi
            echo "App launched and is still running -- smoke test passed."

  assemble-release:
    name: Assemble release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-project
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional -- only runs if the repo has a RELEASE_KEYSTORE_BASE64
      # secret configured. Writes the decoded keystore to a
      # workspace-local file that never leaves this job's runner.
      # `working-directory` (from `defaults.run` above) applies to this
      # `run:` step too, so `release.keystore` lands in android-project/
      # -- unchanged relative-path convention from before this workflow
      # moved to the repo root. Not exercised by a basic debug-APK run
      # (no signing secrets configured); verify this path separately
      # if/when actually wiring up a signed release build.
      - name: Decode release keystore (optional)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKlight-App-release-apk
          path: android-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
