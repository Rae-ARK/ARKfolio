name: Android debug build

# Builds a debug APK on every push to main (and manually, on demand).
# This is the one part of Stage 3 that couldn't be verified from a sandboxed
# dev environment — Google's Maven repos aren't reachable there — so this
# is the first real end-to-end proof the Capacitor/Gradle setup actually
# produces a working APK.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync into Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses + install required platform/build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename debug APK with version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/apk/arkfolio_${VERSION}_debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arkfolio-debug-apk
          path: dist/apk/*debug*.apk
          if-no-files-found: error

      # Signed release build only runs for tagged releases (v*), since it
      # needs the keystore secrets and there's no reason to sign every
      # ordinary push to main.
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — run scripts/generate-keystore.sh and add the repo secrets described in its output."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release-keystore.jks"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remove decoded keystore
        if: always() && startsWith(github.ref, 'refs/tags/')
        run: rm -f "${{ github.workspace }}/release-keystore.jks"

      - name: Rename release APK with version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist/apk/arkfolio_${VERSION}_release.apk"

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: arkfolio-release-apk
          path: dist/apk/*release*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/apk/*.apk
