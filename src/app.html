<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<meta
			name="description"
			content="Rae ARK writes fantasy and science-fantasy stories about people rebuilding themselves — reincarnation, isekai, and the quiet work of learning how to live again."
		/>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
		/>

		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/icon-192.png" type="image/png" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<meta name="theme-color" content="#f6f2e8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)" />

		<script>
			// Set the theme attribute before first paint so there's no flash of the
			// wrong palette. useTheme.svelte.ts reads this same value back on mount.
			(function () {
				try {
					var stored = localStorage.getItem('ark-theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Neutralino desktop shell client library. A harmless no-op script
		     tag on the web/Android build — window.Neutralino only actually
		     connects when the page is served by the Neutralino runtime
		     itself (which injects window.NL_PORT etc). -->
		<script src="/neutralino.js"></script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
